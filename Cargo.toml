[package]
name = "y323"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "y323"
path = "src/main.rs"

[dependencies]
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
hound = "3"
chrono = "0.4"
image = "0.24"

[profile.release]
opt-level = 3
lto = true
